<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HYPR Vasastan Skylt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: fast stående scen 1080×1920 som skalas till skärmen. Logga + studio/klocka överst,
   roterande bilder i mitten, fast lila QR-fält längst ner. Ett enda ljust lila tema (TV i träningssal). */
:root{
  --ink:#f4f0ff;
  --ink-2:#e6dcff;
  --line:#d3c6f3;
  --card:rgba(255,255,255,.72);
  --chalk:#1e1236;
  --mute:#6a5d8a;
  --volt:#6f61aa; /* HYPR-lila från loggan */
  --volt-deep:#54478f;
  --white:#ffffff;
  /* rubriknivåer: H1 välkommen, H2 bildrubrik, H3 radnamn, H4 pris (som H3 men lila); överrubrik ovanför H2 */
  --h1:300px; --h2:84px; --h3:48px; --h4:var(--h3); --kicker:34px;
  /* avstånd: överrubrik→rubrik, rubrik→innehåll, mellan rutor, mellan block */
  --gap-kicker:12px; --gap-head:32px; --gap-rows:10px; --gap-block:44px;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:Barlow,"Helvetica Neue",Arial,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--chalk);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:0;padding-bottom:0;
  -webkit-font-smoothing:antialiased;font-synthesis:none}
.fit{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;transform:translate(-50%,-50%)}
.stage{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;background:
  radial-gradient(1000px 900px at 10% 5%, rgba(111,97,170,.42), transparent 70%),
  radial-gradient(900px 800px at 100% 60%, rgba(214,120,230,.24), transparent 70%),
  linear-gradient(170deg,#d8ccfb 0%,#e6dcff 40%,#efe8ff 75%,#f2ecff 100%)}
.sweep{position:absolute;top:-20%;left:-60%;width:38%;height:140%;background:linear-gradient(90deg,transparent,rgba(111,97,170,.35),transparent);transform:skewX(-16deg);opacity:0;pointer-events:none;z-index:5}
.sweep.go{animation:sweep 1s cubic-bezier(.6,.05,.3,1)}
@keyframes sweep{0%{opacity:0;transform:skewX(-16deg) translateX(0)}20%{opacity:1}100%{opacity:0;transform:skewX(-16deg) translateX(420%)}}

/* topprad */
.top{position:absolute;top:0;left:0;right:0;padding:60px 80px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:3}
.logo{display:block;width:380px;height:auto}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:20px}
.studio{font:700 32px/1 var(--label);letter-spacing:.22em;text-transform:uppercase;color:var(--white);background:var(--volt);padding:16px 18px 14px 26px;border-radius:4px}
.clock{display:flex;align-items:center;gap:16px}
.clock b{font:800 44px/.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cdate{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:700 19px/1.05 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.csep{display:block;width:3px;height:40px;border-radius:2px;background:var(--line)}
.fit.hero-on .cdate{color:rgba(255,255,255,.85)}
.fit.hero-on .csep{background:rgba(255,255,255,.4)}

/* bilder */
.slides{position:absolute;left:0;right:0;top:220px;bottom:340px;z-index:3}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;padding:0 80px;display:flex;flex-direction:column;justify-content:center;gap:var(--gap-head);opacity:0;transform:translateY(36px);transition:opacity .8s ease,transform .8s ease}
.slide.on{opacity:1;transform:none}
.slide.on>*{animation:rise .8s both}
.slide.on>*:nth-child(2){animation-delay:.1s}.slide.on>*:nth-child(3){animation-delay:.2s}.slide.on>*:nth-child(4){animation-delay:.3s}.slide.on>*:nth-child(5){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.eyebrow{font:700 var(--kicker)/1 var(--label);letter-spacing:.3em;text-transform:uppercase;color:var(--volt)}
.mega{font:900 var(--h1)/.82 var(--display);text-transform:uppercase;margin:0;white-space:nowrap;letter-spacing:-.005em}
.big{font:900 var(--h2)/.9 var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
.lead{font:500 50px/1.28 var(--body);margin:0;max-width:22ch;text-wrap:pretty}
.lead.mute{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:16px}
.chip{font:700 34px/1 var(--label);letter-spacing:.16em;text-transform:uppercase;padding:16px 24px 14px;border:3px solid var(--chalk);border-radius:4px}
.chip.fill{background:var(--volt);border-color:var(--volt);color:var(--white)}

/* veckoremsa för Pump */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{border:3px solid var(--line);border-radius:6px;padding:20px 8px 18px;text-align:center}
.day b{display:block;font:800 52px/1 var(--display);text-transform:uppercase}
.day span{display:block;margin-top:10px;font:700 22px/1.15 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.day.today{background:var(--volt);border-color:var(--volt)}
.day.today b,.day.today span{color:var(--white)}

/* dagens schema */
.sched-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.sched-head h2{margin:0;font:900 var(--h2)/.9 var(--display);text-transform:uppercase}
.sched-head .date{font:800 60px/1 var(--display);color:var(--volt);font-variant-numeric:tabular-nums;white-space:nowrap}
.passes{display:flex;flex-direction:column;gap:var(--gap-rows)}
.slide>.eyebrow+*{margin-top:calc(var(--gap-kicker) - var(--gap-head))}
.pass{display:grid;grid-template-columns:200px 1fr auto;align-items:center;gap:28px;padding:22px 28px;background:var(--card);border-radius:10px;box-shadow:0 6px 24px rgba(60,30,120,.08)}
.pass .t{font:800 76px/.9 var(--display);font-variant-numeric:tabular-nums}
.pass .t small{display:block;margin-top:6px;font:700 24px/1 var(--label);letter-spacing:.14em;color:var(--mute)}
.pass .n{min-width:0}
.pass .n b{display:block;font:900 var(--h3)/.92 var(--display);text-transform:uppercase;text-wrap:balance}
.pass .n span{display:block;margin-top:8px;font:600 30px/1.2 var(--body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:700 26px/1 var(--label);letter-spacing:.16em;text-transform:uppercase;padding:12px 16px 10px;border-radius:4px;white-space:nowrap;border:3px solid var(--volt);color:var(--volt)}
.tag.full{border-color:var(--mute);color:var(--mute)}
.pass.next{background:var(--volt);box-shadow:0 14px 40px rgba(84,71,143,.35)}
.pass.next .t,.pass.next .n b{color:var(--white)}
.pass.next .t small,.pass.next .n span{color:rgba(255,255,255,.8)}
.pass.next .tag{border-color:var(--white);color:var(--volt);background:var(--white)}
.pass.now .tag{background:var(--volt);color:var(--white)}
.sched-foot{font:600 30px/1.3 var(--body);color:var(--mute)}

/* medlemskap */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tile{display:flex;flex-direction:column;gap:14px;padding:34px 32px 30px;background:var(--card);border-radius:12px;min-width:0;box-shadow:0 6px 24px rgba(60,30,120,.08)}
.tile h3{margin:0;font:900 54px/.92 var(--display);text-transform:uppercase}
.tile p{margin:0;font:500 28px/1.3 var(--body);color:var(--mute)}
.tile .price{margin-top:auto;padding-top:10px;font:900 104px/.85 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .price em{display:block;margin-top:10px;font:700 26px/1 var(--label);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tile.hi{background:var(--volt)}
.tile.hi h3,.tile.hi .price{color:var(--white)}
.tile.hi p,.tile.hi .price em{color:rgba(255,255,255,.82)}
.tile .flag{align-self:flex-start;font:700 24px/1 var(--label);letter-spacing:.16em;text-transform:uppercase;background:var(--white);color:var(--volt);padding:10px 14px 8px;border-radius:4px}

/* schemat: kompakt så en full dag får plats */
.passes.sched{gap:var(--gap-rows)}
.sched .pass{grid-template-columns:140px 1fr auto;gap:22px;padding:16px 26px}
.sched .pass .t{font-size:48px}
.sched .pass .t small{font-size:18px;margin-top:4px}
.sched .pass .n b{font-size:var(--h3);white-space:nowrap}
.sched .pass .n span{font-size:26px;margin-top:6px}
.sched .tag{font-size:22px;padding:9px 12px 7px}
.sched .tags{display:flex;gap:10px;align-items:center}
.pass.next .tag.dur{background:transparent;color:var(--white);border-color:rgba(255,255,255,.7)}
.pass.now .tag.dur{background:transparent;color:var(--volt)}
.sched-head h2{font-size:var(--h2)}
.sched-head .date{font-size:42px}
.secs{display:flex;flex-direction:column;gap:var(--gap-block)}
.sec{display:flex;flex-direction:column;gap:var(--gap-head)}
.secs.two .sched-head h2{font-size:var(--h2)}
.secs.two .sched-head .date{font-size:42px}

/* medlemskap som rader, samma kort som schemat */
.plan{display:grid;grid-template-columns:1fr auto;min-height:150px;box-sizing:border-box;align-items:center;gap:24px;padding:24px 28px;background:var(--card);border-radius:10px;box-shadow:0 6px 24px rgba(60,30,120,.08)}
.plan .n{min-width:0}
.plan .n b{display:block;font:900 var(--h3)/.92 var(--display);text-transform:uppercase}
.plan>.tag{justify-self:end}
.passes.compact{gap:var(--gap-rows)}
.compact .plan{padding:16px 26px;min-height:0}
.compact .plan .n b{font-size:var(--h3)}
.compact .plan .n .d{margin-top:6px;font-size:26px}
.compact .tag{font-size:22px;padding:9px 12px 7px}
.plan .n .d{display:block;margin-top:8px;font:600 30px/1.2 var(--body);color:var(--mute)}
.plan .pr{color:var(--volt);font:900 var(--h4)/.92 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.plan .pr small{display:block;margin-top:6px;font:700 24px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.plan.hi{background:var(--volt);box-shadow:0 14px 40px rgba(84,71,143,.35)}
.plan.hi .n b,.plan.hi .pr{color:var(--white)}
.plan.hi .n .d,.plan.hi .pr small{color:rgba(255,255,255,.8)}
.plan .n .tag{display:inline-block;margin:0 0 12px;font-size:22px;padding:9px 12px 7px}
.plan.hi .tag{border-color:var(--white);background:var(--white);color:var(--volt)}

/* Välkommen med video */
.hero{position:absolute;left:0;right:0;top:0;bottom:250px;z-index:2;opacity:0;transition:opacity .9s ease;background:linear-gradient(160deg,#8b7cc6,#54478f 65%,#33285f)}
.hero video{display:block;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(30,18,54,.5),rgba(30,18,54,0) 22%,rgba(30,18,54,0) 45%,rgba(30,18,54,.82))}
.hero.on{opacity:1}
.photo-bg{background:#3a2f6e}
.photo-bg img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.hero-slide .big{color:var(--white)}
.logo-w{display:none}
.fit.hero-on .logo{display:none}
.fit.hero-on .logo-w{display:block}
.fit.hero-on .clock{color:var(--white)}
.fit.hero-on .dot{background:rgba(255,255,255,.35)}
.fit.hero-on .dot i{background:var(--white)}
.slide.hero-slide{justify-content:flex-end;padding-bottom:60px;color:var(--white)}
.hero-slide .eyebrow{color:rgba(255,255,255,.88)}
.hero-slide .lead{color:var(--white)}
.hero-slide .studio-line{white-space:nowrap}
.addr{font:400 36px/1.2 var(--body);letter-spacing:.04em;margin:0;color:rgba(255,255,255,.85)}

/* PT med Maria */
.coach{display:grid;grid-template-columns:420px 1fr;gap:44px;align-items:end}
.photo{position:relative;width:420px;height:540px;border-radius:14px;overflow:hidden;box-shadow:0 18px 48px rgba(84,71,143,.35)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.coach .who{display:flex;flex-direction:column;gap:18px;min-width:0;padding-bottom:6px}
.coach .who h2{margin:0;font:900 132px/.84 var(--display);text-transform:uppercase}
.coach .who .role{font:700 30px/1.2 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--volt)}
.cta{display:flex;flex-direction:column;gap:8px;padding:28px 32px;border-radius:12px;background:var(--volt);color:var(--white)}
.cta b{font:900 var(--h3)/.95 var(--display);text-transform:uppercase}
.cta span{font:600 32px/1.3 var(--body);color:rgba(255,255,255,.88)}
/* ruta med QR till höger */
.cta.has-qr{flex-direction:row;align-items:center;justify-content:space-between;gap:28px}
.cta .cta-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.cta .cta-qr{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.cta .cta-qr i{display:block;width:120px;height:120px;background:#fff;padding:8px;border-radius:8px;box-sizing:border-box}
.cta .cta-qr i svg{display:block;width:100%;height:100%}
.cta .cta-qr small{font:700 20px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.88)}

/* företagsträning */
.points{display:flex;flex-direction:column;gap:18px;margin:0;padding:0;list-style:none}
.points li{display:flex;align-items:center;gap:24px;font:600 46px/1.15 var(--body)}
/* punkt = hantel */
.points li::before{content:"";flex:none;width:52px;height:26px;background:var(--volt);-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2036%2018%22%3E%3Crect%20x%3D%220%22%20y%3D%225%22%20width%3D%223%22%20height%3D%228%22%20rx%3D%221%22/%3E%3Crect%20x%3D%223%22%20y%3D%221%22%20width%3D%225%22%20height%3D%2216%22%20rx%3D%221.5%22/%3E%3Crect%20x%3D%228%22%20y%3D%223.5%22%20width%3D%223%22%20height%3D%2211%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2211%22%20y%3D%227.2%22%20width%3D%2214%22%20height%3D%223.6%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2225%22%20y%3D%223.5%22%20width%3D%223%22%20height%3D%2211%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2228%22%20y%3D%221%22%20width%3D%225%22%20height%3D%2216%22%20rx%3D%221.5%22/%3E%3Crect%20x%3D%2233%22%20y%3D%225%22%20width%3D%223%22%20height%3D%228%22%20rx%3D%221%22/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2036%2018%22%3E%3Crect%20x%3D%220%22%20y%3D%225%22%20width%3D%223%22%20height%3D%228%22%20rx%3D%221%22/%3E%3Crect%20x%3D%223%22%20y%3D%221%22%20width%3D%225%22%20height%3D%2216%22%20rx%3D%221.5%22/%3E%3Crect%20x%3D%228%22%20y%3D%223.5%22%20width%3D%223%22%20height%3D%2211%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2211%22%20y%3D%227.2%22%20width%3D%2214%22%20height%3D%223.6%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2225%22%20y%3D%223.5%22%20width%3D%223%22%20height%3D%2211%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2228%22%20y%3D%221%22%20width%3D%225%22%20height%3D%2216%22%20rx%3D%221.5%22/%3E%3Crect%20x%3D%2233%22%20y%3D%225%22%20width%3D%223%22%20height%3D%228%22%20rx%3D%221%22/%3E%3C/svg%3E") center/contain no-repeat}

/* förlopp */
.dots{position:absolute;left:80px;right:80px;bottom:278px;padding-block:22px;display:flex;align-items:center;gap:10px;z-index:5;cursor:pointer}
.dots .dot:hover{opacity:.7}
.dot{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.dot i{display:block;height:100%;width:0;background:var(--chalk)}
.dot.done i{width:100%}
.dot.on i{animation:fill var(--dur) linear forwards}
@keyframes fill{to{width:100%}}

/* QR-fält */
.band{position:absolute;left:0;right:0;bottom:0;height:250px;background:var(--volt);z-index:4;display:grid;grid-template-columns:repeat(2,1fr)}
.band::before{content:"";position:absolute;left:0;right:0;top:-34px;height:36px;background:var(--volt);clip-path:polygon(0 calc(100% - 2px),100% 0,100% 100%,0 100%)}
.cell{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:26px;min-width:0;padding:0 24px}
.qr{width:150px;height:150px;flex:none;background:#fff;padding:9px;border-radius:10px;box-shadow:0 12px 36px rgba(60,20,140,.3)}
.qr svg{display:block;width:100%;height:100%}
.cap{text-align:left;min-width:0}
.cap b{display:block;white-space:nowrap;font:900 42px/.92 var(--display);text-transform:uppercase;color:#fff}
.cap span{display:block;margin-top:8px;font:700 22px/1.2 var(--label);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.82)}

/* HYROX-resultat */
.hx-bg{background:#1e1236}
.hx-bg img{object-position:center 22%;opacity:.15}
.hx-bg::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:#6f61aa;mix-blend-mode:color;opacity:.6;z-index:1;pointer-events:none}
.hx-bg .shade{z-index:2;background:linear-gradient(180deg,rgba(30,18,54,.55),rgba(30,18,54,.12) 20%,rgba(30,18,54,.3) 38%,rgba(30,18,54,.85) 60%,#1e1236 82%)}
.hx-logo{display:block;width:300px;height:auto;margin-bottom:6px}
.hx-time{font:900 250px/.8 var(--display);color:#ffe600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:0}
.hx-chips{display:flex;flex-wrap:wrap;gap:14px}
.hx-chips span{font:700 32px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;padding:14px 20px 12px;border:3px solid rgba(255,255,255,.85);border-radius:4px;color:#fff}
.hx-chips span.pb{background:#ffe600;border-color:#ffe600;color:#16121f}
.hx-stats{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;column-gap:20px;border-top:2px solid rgba(255,255,255,.3);padding-top:24px}
.hx-stats div{display:flex;flex-direction:column;gap:8px}
.hx-stats small{font:700 19px/1 var(--label);white-space:nowrap;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.hx-stats b{font:800 54px/.9 var(--display);font-variant-numeric:tabular-nums;color:#fff}
.hx-stats b i{font:700 19px/1 var(--label);font-style:normal;letter-spacing:.1em;color:rgba(255,255,255,.75);margin-left:3px}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  .slide,.slide.on>*{transition:none;animation:none}
  .sweep{display:none}
  .dot.on i{animation:none;width:100%}
}
</style>

<div class="fit" id="fit">
  <div class="stage">
    <div class="hero" id="hero"><video id="heroVid" muted loop playsinline autoplay preload="auto"></video><div class="shade"></div></div>
    <div class="hero photo-bg" id="ptbg"><img id="ptImg" alt=""><div class="shade"></div></div>
    <div class="hero photo-bg hx-bg" id="hyroxbg"><img src="https://hyrox.com/wp-content/uploads/2022/06/Two-Women-running-at-the-HYROX-race.jpg" alt="" onerror="this.remove()"><div class="shade"></div></div>
    <div class="sweep" id="sweep"></div>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const pad2=n=>String(n).padStart(2,"0");
function parse(s){const [d,t]=s.split(" ");const [y,m,dd]=d.split("-").map(Number);const [h,mi]=t.split(":").map(Number);return new Date(y,m-1,dd,h,mi)}
function cleanName(n){return n.replace(/\s*-\s*(Vasastan|Östermalm)$/i,"").replace(/^HYPR\s+/i,"").trim()}
function cleanFocus(f){return f? f.charAt(0)+f.slice(1).toLowerCase() : ""}
function coachNames(c){const first=c.split(",").map(x=>x.trim().split(" ")[0]).filter(Boolean);return first.length? "med "+first.join(" & ") : ""}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

/* Dagens pass som inte är slut. Är det 4 eller färre kvar visas även nästa dag med pass.
   Finns inga kvar idag visas bara nästa dag med pass. */
function scheduleSlide(){
  const now=new Date();
  const items=SCHEDULE.map(r=>({start:parse(r[0]),len:r[1],name:cleanName(r[2]),focus:cleanFocus(r[3]),coach:coachNames(r[4]),full:!!r[5]}))
    .filter(p=>p.start.getTime()+p.len*60000>now.getTime());
  const tm=new Date(now); tm.setDate(tm.getDate()+1);
  const dayTitle=d=>sameDay(d,now)?"Idag":sameDay(d,tm)?"Imorgon":DAYS_LONG[d.getDay()];
  const today=items.filter(p=>sameDay(p.start,now));
  const sections=[];
  if(today.length) sections.push({day:now,list:today});
  if(today.length<=4){
    const later=items.find(p=>!sameDay(p.start,now));
    if(later) sections.push({day:later.start,list:items.filter(p=>sameDay(p.start,later.start))});
  }
  if(!sections.length){
    return {dur:7000,html:`
      <div class="eyebrow">Schema</div>
      <h2 class="big">Se veckans pass i appen</h2>
      <p class="lead">Ladda ner Wondr, välj HYPR och boka din plats.</p>`};
  }
  const two=sections.length>1;
  let budget=two?8:7, hidden=0, nextMarked=false;
  const html=sections.map(sec=>{
    const title=dayTitle(sec.day);
    const shown=sec.list.slice(0,budget); budget-=shown.length; hidden+=sec.list.length-shown.length;
    const rows=shown.map(p=>{
      const running=p.start<=now;
      let cls="pass", tag="";
      if(running){cls+=" now";tag=`<span class="tag">Pågår</span>`}
      else if(!nextMarked && title==="Idag"){cls+=" next";nextMarked=true;tag=`<span class="tag">Nästa</span>`}
      const sub=[p.focus,p.coach].filter(Boolean).join(" · ");
      return `<div class="${cls}"><div class="t">${pad2(p.start.getHours())}:${pad2(p.start.getMinutes())}</div>
        <div class="n"><b>${esc(p.name)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div><div class="tags">${tag}<span class="tag dur">${p.len} min</span></div></div>`;
    }).join("");
    return `<div class="sec"><div class="sched-head"><h2>${esc(title)}</h2><div class="date">${DAYS[sec.day.getDay()]} ${sec.day.getDate()}/${sec.day.getMonth()+1}</div></div>
      <div class="passes sched">${rows}</div></div>`;
  }).join("");
  const foot=hidden?`<div class="sched-foot">+ ${hidden} pass till. Hela schemat finns i Wondr-appen.</div>`:`<div class="sched-foot">Boka ditt pass i Wondr-appen.</div>`;

/* --- skalning --- */
const fit=document.getElementById("fit");
function layout(){
  const vw=Math.max(1,innerWidth-32), vh=Math.max(1,innerHeight);
  fit.style.transform=`translate(-50%,-50%) scale(${Math.min(vw/1080,vh/1920)})`;
  fitAll();
}
function fitText(el){
  const max=parseFloat(el.dataset.max||getComputedStyle(el).fontSize);
  el.dataset.max=max; el.style.fontSize=max+"px";
  const box=el.parentElement.clientWidth-parseFloat(getComputedStyle(el.parentElement).paddingLeft)*2;
  let size=max;
  while(el.scrollWidth>box && size>60){ size-=6; el.style.fontSize=size+"px"; }
}
function fitAll(){document.querySelectorAll("[data-fit]").forEach(fitText)}

/* --- klocka --- */
function tick(){const n=new Date();
  document.getElementById("time").textContent=n.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("wday").textContent=DAYS_LONG[n.getDay()];
  document.getElementById("dm").textContent=n.getDate()+"/"+(n.getMonth()+1);}

/* --- loopen: bygg om varje varv så schema och Pump-fokus följer klockan --- */
let slides=[], els=[], idx=-1, timer=null;
const box=document.getElementById("slides"), dots=document.getElementById("dots"), sweep=document.getElementById("sweep");
function render(){
  slides=buildSlides();
  box.innerHTML=slides.map(s=>`<section class="slide${s.bg?" hero-slide":""}">${s.html}</section>`).join("");
  els=[...box.children];
  dots.innerHTML=slides.map(()=>`<div class="dot"><i></i></div>`).join("");
}
function next(){
  idx=(idx+1)%slides.length;
  if(idx===0 && els.length && els[0].classList.contains('on')===false) render();
  els.forEach((e,i)=>e.classList.toggle("on",i===idx));
  fit.classList.toggle("hero-on",!!slides[idx].bg);
  ["hero","ptbg","hyroxbg"].forEach(id=>document.getElementById(id).classList.toggle("on",slides[idx].bg===id));
  [...dots.children].forEach((d,i)=>{d.classList.toggle("done",i<idx);d.classList.toggle("on",i===idx);d.style.setProperty("--dur",slides[idx].dur+"ms");
    if(i===idx){const bar=d.firstElementChild;bar.style.animation="none";void bar.offsetWidth;bar.style.animation="";}});
  els[idx].querySelectorAll("[data-fit]").forEach(fitText);
  sweep.classList.remove("go"); void sweep.offsetWidth; sweep.classList.add("go");
  clearTimeout(timer); timer=setTimeout(next,slides[idx].dur);
}
/* klicka på en stapel för att hoppa till den bilden */
function goTo(i){ if(i===idx) return; idx=i-1; if(idx<0) idx=slides.length-1; next(); }
dots.addEventListener("click",e=>{const r=dots.getBoundingClientRect(),n=dots.children.length;if(!n)return;goTo(Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)/r.width*n))));});

/* --- QR --- */
document.getElementById("qrMedlem").innerHTML=QR.medlem;
document.getElementById("qrInsta").innerHTML=QR.insta;

/* --- start --- */
addEventListener("resize",layout);
fit.addEventListener("dblclick",()=>{try{var d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().catch(function(){})}catch(e){}});
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
wake();
setInterval(tick,1000); tick();
render(); layout(); idx=-1; next();
if(HERO_VIDEO){const v=document.getElementById("heroVid");v.src=HERO_VIDEO;if(v.play){var p=v.play();if(p&&p.catch)p.catch(function(){})}}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
